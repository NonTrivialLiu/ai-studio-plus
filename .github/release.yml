changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: UI / UX
      labels:
        - ui
        - ux
    - title: Documentation & Tooling
      labels:
        - docs
        - ci
        - chore
    - title: Other Changes
      labels:
        - "*"
