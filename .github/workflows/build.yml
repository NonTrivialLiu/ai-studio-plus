name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint, bundle check, and unit tests
        run: npm test
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs = require('node:fs'); const v = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8')).version; if (process.env.GITHUB_REF_NAME !== 'v' + v) { console.error('Tag', process.env.GITHUB_REF_NAME, 'does not match v' + v); process.exit(1); }"

  browser:
    name: Browser extension tests & package
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_VERSION: '1.65.1'
      AIP_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium for extension tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium
      - name: Install Chromium system dependencies (cached binary)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser
      - name: Package and verify zip
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Plus-WebExtension
          path: build/AI-Studio-Plus-WebExtension.zip
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AI-Studio-Plus-WebExtension
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" AI-Studio-Plus-WebExtension.zip --generate-notes
